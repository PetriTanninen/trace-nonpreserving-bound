[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-nonpreserving-bound"
version = "0.1.0"
description = "Reproducible numerical and symbolic support for spectral bounds of 2-positive maps"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Petri Tanninen, Sentient Machine Corporation", email = "petri@sentientmachine.com"}]
maintainers = [{name = "Petri Tanninen, Sentient Machine Corporation", email = "petri@sentientmachine.com"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
spectral-bound = "spectral_bounds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
